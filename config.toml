[discord]
bot_token = "${DISCORD_BOT_TOKEN}"
allowed_channels = ["${DISCORD_CHANNEL_ID}"]
# allowed_channels = ["1490914497123188758", "1491647157202063483"]
# allowed_users = ["<YOUR_DISCORD_USER_ID>"]  # empty or omitted = allow all users
# allow_bot_messages = "off"  # "off" (default) | "mentions" | "all"
                               # "mentions" is recommended for multi-agent collaboration
# trusted_bot_ids = []         # empty = any bot (mode permitting); set to restrict
# allow_user_messages = "involved"  # "involved" (default) | "mentions"
                                     # "involved" = reply in threads bot owns or has participated in
                                     # "mentions" = always require @mention

# [slack]
# bot_token = "${SLACK_BOT_TOKEN}"     # Bot User OAuth Token (xoxb-...)
# app_token = "${SLACK_APP_TOKEN}"     # App-Level Token (xapp-...) for Socket Mode
# allowed_channels = ["C0123456789"]   # empty or omitted = allow all channels
# allowed_users = ["U0123456789"]      # empty or omitted = allow all users
# allow_bot_messages = "off"           # "off" (default) | "mentions" | "all"
# trusted_bot_ids = []                 # empty = any bot (mode permitting); set to restrict
# allow_user_messages = "involved"     # "involved" (default) | "mentions"
                                        # "involved" = reply in threads bot has participated in
                                        # "mentions" = always require @mention

[agent]
command = "kiro-cli"
args = ["acp", "--trust-all-tools"]
working_dir = "/home/agent"

[pool]
max_sessions = 10
session_ttl_hours = 24

[reactions]
enabled = true
remove_after_reply = false

[reactions.emojis]
queued = "👀"
thinking = "🤔"
tool = "🔥"
coding = "👨💻"
web = "⚡"
done = "🆗"
error = "😱"

[reactions.timing]
debounce_ms = 700
stall_soft_ms = 10000
stall_hard_ms = 30000
done_hold_ms = 1500
error_hold_ms = 2500

[stt]
enabled = true
api_key = "${GROQ_API_KEY}"
